name: Linux receiver build and validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hellocar-linux-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-24.04
    container: debian:bookworm
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Debian host and ARM hard-float dependencies
        run: |
          dpkg --add-architecture armhf
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git cmake ninja-build \
            build-essential gcc-arm-linux-gnueabihf libc6-dev-armhf-cross python3 python3-venv \
            qemu-user ffmpeg dbus-daemon libdbus-1-3 binutils \
            libssl-dev libmbedtls-dev libcjson-dev \
            libssl-dev:armhf libmbedtls-dev:armhf libcjson-dev:armhf
      - uses: actions/checkout@v4
      - name: Install locked Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.90.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add armv7-unknown-linux-gnueabihf --toolchain 1.90.0
      - name: Build and test both Linux architectures
        run: bash tools/build.sh
      - name: Upload validated Linux receiver packages
        uses: actions/upload-artifact@v4
        with:
          name: hellocar-linux-receivers
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/validation.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
